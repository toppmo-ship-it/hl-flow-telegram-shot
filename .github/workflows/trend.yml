name: trend-report

# 5프레임 추세 리포트 전용 작업 — 다른 발송(shot.yml: 흐름차트·카드·순위·하이퍼 리포트, coin.yml, chat.yml, warm.yml)과 완전히 따로 돈다.
# 한 번 시작하면 약 22분 동안 20초마다 '지금 보내기' 요청·정해진 주기(5/15/30/60분)를 확인하고, 끝나면 스스로 다음 실행을 이어 건다(이어달리기).
# cron 은 워치독: 이미 실행 중/대기 중인 게 있으면 건너뛰고, 사슬이 끊겼을 때만 되살린다.
# 캔들 저장본은 이 작업 전용 캐시(trend-…)에 둠 → 다른 작업의 캐시(store-…)와 섞이지 않음.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "true = 텔레그램으로 보내지 않고 한 번만 만들어 보기(시험용)"
        default: "false"

concurrency:
  group: trend-report
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # 다음 실행을 스스로 이어 걸기 위해

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 중복 실행 방지(워치독용)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/trend.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "이어달리기가 살아 있음(진행/대기 ${n}건) — 이번 cron은 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "진행 중인 실행이 없음 — 사슬이 끊긴 것으로 보고 되살림"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: 한글 글꼴 설치
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f

      - name: 캔들 저장본 이어받기
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: trend-${{ github.run_id }}
          restore-keys: |
            trend-

      - name: 추세 리포트 (약 22분 동안 감시하며 발송)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 32
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_ID2: ${{ secrets.TG_CHAT_ID2 }}
          TREND_DRY: ${{ github.event.inputs.dry }}
          TREND_ONCE: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: node trendjob.mjs

      # 실패·시간초과여도 캐시는 저장(다음 실행이 이어받음)
      - name: 캔들 저장본 저장
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: trend-${{ github.run_id }}

      # 실패해도(if: always) 반드시 다음 실행을 걸음. 시험용 dry 실행은 이어가지 않음.
      - name: 다음 실행 이어 걸기
        if: ${{ always() && steps.guard.outputs.skip != 'true' && github.event.inputs.dry != 'true' }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run trend.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"; then echo "다음 실행 예약 OK (시도 $i)"; exit 0; fi
            echo "예약 실패 $i/5 — 20초 뒤 재시도"; sleep 20
          done
          echo "::error::다음 실행 예약에 5번 모두 실패 — cron 워치독이 되살릴 때까지 멈춤"; exit 1
