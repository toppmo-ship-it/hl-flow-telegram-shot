name: cs-alert

# 차트스캐너(브트) 폰 알림 서버 상시 실행: 가격 알림(호가 웹소켓)과 PivotScope 다이버전스 알람을 감시해 폰·PC 알림창(웹 푸시)으로 바로 보냅니다.
# 한 번에 약 5시간 35분 동안 돌다가 끝나면 스스로 다음 실행을 걸어 이어달립니다(챗봇 chat.yml 과 같은 방식, 서로 별개 작업).
#  - 설치할 패키지는 web-push 하나뿐이라 시작이 빠르고, 이어달리는 사이 빈 시간이 짧습니다
#  - cron 은 워치독: 이어달리기가 끊겼을 때만 되살립니다(이미 돌고 있으면 아무것도 안 함)
# (2026-11-12) 같은 알림을 텔레그램 리포트 방(TG_CHAT_ID2, 비면 TG_CHAT_ID)에도 글로 보냄. csalert.mjs 를 고쳐 올리면(push) 돌던 서버를 바로 새 코드로 교체.
on:
  push:
    branches: [main]
    paths: ["csalert.mjs", ".github/workflows/csalert.yml"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: cs-alert
  # 코드를 올린(push) 실행만 돌던 서버를 끊고 교체. 이어달리기·워치독은 서로 끊지 않음. 가격 기준·다이버전스 '본 기록'은 Supabase 에 있어 교체해도 중복 알림이 나지 않음
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 중복 실행 방지(워치독용)
        id: guard
        run: |
          # 푸시 서명 비밀키(VAPID_PRIVATE_KEY)가 아직 등록되지 않았으면 아무것도 하지 않고 쉼(실패·재시도 반복 방지)
          if [ "${{ secrets.VAPID_PRIVATE_KEY != '' }}" != "true" ]; then echo "VAPID_PRIVATE_KEY 비밀값이 없어 쉼 — 저장소 Settings → Secrets → Actions 에 등록하세요"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/csalert.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "알림 서버가 살아 있음(진행/대기 ${n}건) — 이번 cron은 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "진행 중인 알림 서버가 없음 — 끊긴 것으로 보고 되살림"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: 알림 서버 실행
        id: srv
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 345
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_ID2: ${{ secrets.TG_CHAT_ID2 }}
          CSA_MAX_MIN: "335"
        run: node csalert.mjs

      # 정상 종료든 오류든 반드시 다음 실행을 이어 걺. 시작 직후 계속 실패하면 1초마다 도는 일이 없도록 최소 간격을 둠
      - name: 다음 알림 서버 실행 이어걸기
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        run: |
          now=$(date +%s); el=$(( now - ${{ steps.guard.outputs.t0 || 0 }} ))
          if [ "$el" -lt 300 ]; then echo "실행이 ${el}초 만에 끝남 — 1분 쉬고 이어걸기"; sleep 60; fi
          for i in 1 2 3 4 5; do
            if gh workflow run csalert.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"; then echo "다음 알림 서버 예약 OK (시도 $i)"; exit 0; fi
            echo "예약 실패 $i/5 — 20초 뒤 재시도"; sleep 20
          done
          echo "::error::다음 알림 서버 예약 5번 실패 — cron 워치독이 되살릴 때까지 멈춤"; exit 1
