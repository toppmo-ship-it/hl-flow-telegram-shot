<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종목 카드</title>
<style>
:root{--bg:#070b13;--panel:#0b111c;--line:#1b2840;--tx:#e6edf8;--mute:#8fa3c4;--up:#ff4d5d;--dn:#4fc3ff;--gold:#ffd84d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(900px 420px at 15% -10%,#0f2142 0,#05080f 62%,#03050a 100%);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif}
#card{position:relative;width:100vw;height:100vh;padding:14px 16px 12px}   /* 화면(뷰포트) 크기에 맞춰 늘어남: 폴드 1200×1100 · 갤탭·PC 16:10 1600×1000 */
#head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 6px 6px;height:82px}
#hl{flex:1 1 auto;min-width:0}
#per{display:inline-block;margin-left:14px;padding:3px 12px;border-radius:9px;font-size:19px;font-weight:800;color:#ffd84d;background:rgba(255,216,77,.10);border:1px solid rgba(255,216,77,.45);vertical-align:3px;letter-spacing:.02em}
#sub{margin-top:5px;font-size:16px;color:#8fa3c4;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:26px;font-weight:800;letter-spacing:.01em;text-shadow:0 0 14px rgba(120,200,255,.55)}
#px{flex:none;white-space:nowrap;font-size:28px;font-weight:800;color:var(--gold);text-shadow:0 0 14px rgba(255,216,77,.5)}
#ts{font-size:18px;color:#a9bddf;font-weight:700;margin-right:28px;letter-spacing:.01em;font-variant-numeric:tabular-nums;text-shadow:none}
#px small{font-size:20px;color:var(--mute);font-weight:600;margin-right:8px}
#chart{position:absolute;left:12px;right:12px;top:92px;bottom:84px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 0 22px rgba(60,140,255,.14)}
.legend{position:absolute;left:24px;top:106px;z-index:5;font-size:15px;color:var(--mute);font-weight:600}
.legend b{color:var(--gold)}
#qf{position:absolute;right:16px;bottom:10px;left:16px;height:68px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px}
#qf .r1,#qf .r2{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
#qf .chip{padding:3px 11px;border-radius:8px;font-size:15px;font-weight:800;border:1px solid #2a3f68;background:rgba(10,18,32,.9);color:#cfe0ff;white-space:nowrap}
#qf .sc{font-size:17px;padding:3px 14px}
#qf .it{font-size:14.5px;font-weight:700;color:#b7c6e2;white-space:nowrap;padding:2px 9px;border-radius:7px;background:rgba(10,18,32,.75);border:1px solid #1d2b47}
#qf .it b{font-weight:800;color:#e8f0ff}
#qf .up{color:#ff6b78}#qf .dn{color:#5fb8ff}
/* ── 좁은 세로 화면(폴드 접힘 540px 등): 위 제목줄은 3줄로 쌓고, 아래 지표 칩은 줄바꿈 · 차트는 남는 높이를 채움 → 글자가 겹치거나 잘리지 않게 ── */
@media (max-width:760px){
 #card{display:flex;flex-direction:column;padding:12px 12px 10px}
 #head{flex:none;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;height:auto;padding:0 4px 8px}
 #hl{flex:none}
 #ttl{display:block;font-size:25px;margin-bottom:5px}
 #per{display:inline-block;margin-left:0;font-size:15px;padding:2px 10px;vertical-align:middle}
 #sub{margin-top:6px;font-size:14px}
 #px{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:26px;width:100%}
 #ts{font-size:15px;margin-right:0}
 #px small{font-size:17px;margin-right:6px}
 #px .pr{white-space:nowrap}
 #chart{position:relative;left:auto;right:auto;top:auto;bottom:auto;flex:1 1 auto;min-height:0;margin:0 0 8px}
 .legend{font-size:13px}
 #qf{position:static;flex:none;height:auto;left:auto;right:auto;bottom:auto;align-items:stretch;justify-content:flex-start;gap:6px;padding:0 2px}
 #qf .r1,#qf .r2{flex-wrap:wrap;justify-content:center;gap:6px}
 #qf .chip{font-size:14px;padding:3px 10px}
 #qf .sc{font-size:15.5px;padding:3px 12px}
 #qf .it{font-size:13px;padding:2px 8px}
}
</style>
</head>
<body>
<div id="card">
 <div id="head"><div id="hl"><div><span id="ttl"></span><span id="per"></span></div><div id="sub"></div></div><div id="px"></div></div>
 <div id="chart"></div>
 <div class="legend" id="lg"></div>
 <div id="qf"></div>
</div>
<script src="/vendor/lightweight-charts.js"></script>
<script src="/patterns.js"></script>
<script src="/quant.js"></script>
<script src="/chartlib.js"></script>
<script>
(function(){
"use strict";
const LW=window.LightweightCharts,KST=9*3600;
const pad=n=>String(n).padStart(2,"0"),WD=["일","월","화","수","목","금","토"];
window.renderCard=function(d){
 document.getElementById("ttl").textContent=d.ttl||d.title;document.getElementById("per").textContent=d.period||"";document.getElementById("sub").textContent=d.sub||"";
 document.getElementById("px").innerHTML="<span id=\"ts\">"+(d.stamp||"")+"</span><span class=\"pr\"><small>Price</small>$"+d.price+"</span>";
 const el=document.getElementById("chart");
 document.getElementById("lg").style.top=(el.offsetTop+12)+"px";   /* 범례는 차트 맨 위에 맞춤 */
 const ctl=ChartLib.build(el,{candles:d.candles,daily:d.daily||[]},{iv:d.iv,mode:d.mode||"pattern",layers:d.layers||undefined,windowBars:d.windowBars,colors:d.colors,barSpacing:8,scale:d.scale||"all",kel:{on:true,wC:3,wB:3},ict:{sr:true,struct:true,fvg:true,ob:true,liq:true,pd:true}});
 document.getElementById("lg").innerHTML="";
 window.__ctl=ctl;ctl.titles();
 [150,350,600].forEach(function(t){setTimeout(function(){try{document.getElementById("lg").style.top=(document.getElementById("chart").offsetTop+12)+"px";ctl.titles();}catch(e){}},t);});   /* 좁은 화면은 차트 레이아웃이 늦게 확정돼서 창 제목 위치를 사진 찍기 전에 여러 번 다시 잡음 */
 const sum=ctl.summary();
 try{ if(sum.quant){const q=sum.quant,P=q.pts,qf=document.getElementById("qf");
  const ar=(on)=>on?'<span class="up">▲</span>':'<span class="dn">▼</span>';
  const f=(v,dg)=>v==null?"—":(Math.abs(v)>=1000?v.toFixed(0):v.toFixed(dg));
  const sc=q.score,scCls=sc>=5?"background:#5a1620;border-color:#ff6b78;color:#ffd0d5":sc<=1?"background:#10294a;border-color:#5fb8ff;color:#cde6ff":"";
  const labMap={"HH/HL":"상승구조 HH/HL","LH/LL":"하락구조 LH/LL","HH/LL":"확장 HH/LL","LH/HL":"수렴 LH/HL"};
  qf.innerHTML='<div class="r1">'+(sum.kel?'<span class="chip">일봉 켈트너 '+sum.kel.pos+'</span>':'')+(q.lab?'<span class="chip">'+(labMap[q.lab]||q.lab)+'</span>':'')+'<span class="chip sc" style="'+scCls+'">지표 점수 '+sc+' / 6</span></div>'+
  '<div class="r2">'+
  '<span class="it">거래량 <b>×'+f(q.volX,1)+'</b> '+ar(P.vol)+'</span>'+
  '<span class="it">RSI <b>'+f(q.rsi,1)+'</b> '+ar(P.rsi)+'</span>'+
  '<span class="it">MACD(10/25/8) <b>'+(q.macdH>=0?"+":"")+f(q.macdH,Math.abs(q.macdH)<1?3:2)+'</b> '+ar(P.macd)+'</span>'+
  '<span class="it">%R14 <b>'+f(q.w14,0)+'</b> '+ar(P.w14)+'</span>'+
  '<span class="it">%R48 <b>'+f(q.w48,0)+'</b> '+ar(P.w48)+'</span>'+
  '<span class="it">VWAP(구조 시작점) <b>'+(q.avGap==null?"—":(q.avGap>=0?"+":"")+q.avGap.toFixed(1)+"%")+'</b> '+ar(P.vwap)+'</span></div>';
 }}catch(e){}
 return sum;
};})();
</script>
</body>
</html>
