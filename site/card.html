<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종목 카드</title>
<style>
:root{--bg:#070b13;--panel:#0b111c;--line:#1b2840;--tx:#e6edf8;--mute:#8fa3c4;--up:#ff4d5d;--dn:#4fc3ff;--gold:#ffd84d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(900px 420px at 15% -10%,#0f2142 0,#05080f 62%,#03050a 100%);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif}
#card{position:relative;width:1200px;height:1100px;padding:14px 16px 12px}
#head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:0 6px 8px}
#ttl{font-size:30px;font-weight:800;letter-spacing:.01em;text-shadow:0 0 14px rgba(120,200,255,.55)}
#px{font-size:30px;font-weight:800;color:var(--gold);text-shadow:0 0 14px rgba(255,216,77,.5)}
#px small{font-size:20px;color:var(--mute);font-weight:600;margin-right:8px}
#chart{position:absolute;left:12px;right:12px;top:62px;bottom:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 0 22px rgba(60,140,255,.14)}
.legend{position:absolute;left:24px;top:76px;z-index:5;font-size:15px;color:var(--mute);font-weight:600}
.legend b{color:var(--gold)}
</style>
</head>
<body>
<div id="card">
 <div id="head"><div id="ttl"></div><div id="px"></div></div>
 <div id="chart"></div>
 <div class="legend" id="lg"></div>
</div>
<script src="/vendor/lightweight-charts.js"></script>
<script src="/patterns.js"></script>
<script src="/chartlib.js"></script>
<script>
(function(){
"use strict";
const LW=window.LightweightCharts,KST=9*3600;
const pad=n=>String(n).padStart(2,"0"),WD=["일","월","화","수","목","금","토"];
window.renderCard=function(d){
 document.getElementById("ttl").textContent=d.title;
 document.getElementById("px").innerHTML="<small>Price</small>$"+d.price;
 const el=document.getElementById("chart");
 const ctl=ChartLib.build(el,{candles:d.candles,daily:d.daily||[]},{iv:d.iv,mode:d.mode||"pattern",windowBars:d.windowBars,colors:d.colors,barSpacing:8,kel:{on:true,wC:3,wB:3},ict:{sr:true,struct:true,fvg:true,ob:true,liq:true,pd:true}});
 document.getElementById("lg").innerHTML="";
 ctl.titles();
 return ctl.summary();
};})();
</script>
</body>
</html>
